<!DOCTYPE html>
<html lang="fr" data-js-runtime="disabled">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pawat Labz - Laboratoire creatif vivant</title>
  <meta
    name="description"
    content="Pawat-Labz est un laboratoire creatif ou musique, animation, developpement, gaming, tutos et experiences interactives se connectent."
  />
  <meta property="og:title" content="Pawat Labz - Laboratoire creatif vivant" />
  <meta
    property="og:description"
    content="Musique, animation, dev, gaming, freestyle et tutos se croisent dans un laboratoire cyber/neon vivant."
  />
  <meta property="og:image" content="https://pierre-cinart.github.io/Pawat-Labz/assets/images/animation/sagaz-zzz-cover.webp" />
  <meta property="og:url" content="https://pierre-cinart.github.io/Pawat-Labz/" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!--
    Toute la feuille de style passe par main.css, qui importe ensuite les
    fichiers specialises (variables, base, layout, composants, etc.).
    Cette approche garde le projet lisible des le premier commit.
  -->
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <noscript>
    <section class="no-js-fallback" aria-labelledby="no-js-title">
      <div class="no-js-fallback__panel">
        <p class="no-js-fallback__kicker">PAWAT LABZ / SPA</p>
        <h1 class="no-js-fallback__title" id="no-js-title">JavaScript est requis pour entrer dans le laboratoire.</h1>
        <p class="no-js-fallback__text">
          Pawat-Labz fonctionne comme une application web interactive avec un routeur, des sections dynamiques,
          des lecteurs et des outils. Active JavaScript dans ton navigateur puis recharge la page pour explorer le Lab.
        </p>
        <p class="no-js-fallback__text no-js-fallback__text--en">
          Pawat-Labz runs as an interactive web application with routing, dynamic sections, players and tools.
          Enable JavaScript in your browser, then reload the page to explore the Lab.
        </p>
      </div>
    </section>
  </noscript>

  <!--
    Les elements d'ambiance sont fixes dans la page complete, car ils doivent
    rester visibles meme quand le contenu du main change via le routeur.
  -->
  <div class="background-grid" aria-hidden="true"></div>
  <div class="scan-line" aria-hidden="true"></div>

  <!--
    Le shell global du site est compose de :
    - un header persistant
    - une zone main #app pilotee par le routeur
    - un footer persistant

    Seule la zone #app change au fil de la navigation.
  -->
  <div class="site-shell">
    <header class="site-header" id="site-header"></header>
    <main class="site-main" id="app" tabindex="-1" aria-live="polite"></main>
    <footer class="site-footer" id="site-footer"></footer>
  </div>

  <!--
    app.js orchestre le demarrage :
    1. il injecte le header et le footer
    2. il initialise le routeur hash SPA
    3. il declenche le premier rendu de page
  -->
  <script type="module" src="scripts/app.js"></script>
</body>
</html>
